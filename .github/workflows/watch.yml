name: Discogs watcher

on:
  schedule:
    - cron: "3-59/10 * * * *"   # every 10 min at :03, :13, ... (GitHub may delay runs by a few minutes)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test notification instead of checking"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: discogs-watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Discogs
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCOGS_TOKEN: ${{ secrets.DISCOGS_TOKEN }}
          CURRENCY: EUR
          STATE_FILE: state.github.json
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python watch.py --test
          else
            python watch.py
          fi

      - name: Save state / keep repo active
        run: |
          git config user.name "discogs-watcher"
          git config user.email "discogs-watcher@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.github.json)" ]; then
            git add state.github.json
            git commit -m "Update for-sale counts"
          else
            # GitHub pauses scheduled workflows after 60 days without repo activity.
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
              git commit --allow-empty -m "Keepalive"
            fi
          fi
          git push || (git pull --rebase && git push)
